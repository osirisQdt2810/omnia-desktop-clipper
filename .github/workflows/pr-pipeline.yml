# PR pipeline: tests -> Claude review -> gated auto-merge.
# Same gate design as osirisQdt2810/omnia: merge needs green tests + an explicit
# APPROVE verdict + the `automerge` label + an unchanged head commit.
# A PR that modifies .github/workflows cannot pass review (Claude app
# anti-tampering) and always needs a manual merge.

name: PR Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]

concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    # The clipper targets Windows, macOS and Linux — test on all three.
    # The darwin-marked pyobjc dep installs only on the macOS leg.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12 for the widest OCR (rapidocr-onnxruntime) wheel availability — see requirements.txt.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime deps + test runner
        run: pip install -r requirements.txt pytest
      - name: Run test suite
        run: pytest tests/ -q

  pr-body:
    name: PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # A template only PRE-FILLS the web UI — `gh pr create --body` bypasses it entirely, and
      # that is how most of this repo's PRs are opened. So the format is checked here rather
      # than hoped for. Headings only: what goes UNDER them is a judgement call a grep cannot
      # make, but a missing section is unambiguous.
      - name: Require the template's sections
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Normalise before matching: the GitHub web editor stores CRLF and readily leaves a
          # trailing space on a heading line. Neither changes what the heading SAYS, and a
          # format check that fails on invisible characters teaches people to ignore it.
          normalised=$(printf '%s' "$BODY" | tr -d '\r' | sed 's/[[:space:]]*$//')
          missing=()
          while IFS= read -r heading; do
            [ -z "$heading" ] && continue
            grep -qxF "$heading" <<< "$normalised" || missing+=("$heading")
          done <<'HEADINGS'
          ## Context
          ## Content / Changes
          ## Test Plan
          ### Test Details
          ### Test Output / Feature Demonstration
          HEADINGS
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'PR description is missing required section(s):\n'
            printf '  %s\n' "${missing[@]}"
            printf '\nStart from .github/pull_request_template.md and keep every heading.\n'
            printf 'A section that does not apply gets "N/A — <reason>", not a deletion.\n'
            printf '\nAfter fixing the description, re-run this by toggling the automerge\n'
            printf 'label — `edited` is deliberately not a trigger, so a typo fix does not\n'
            printf 'restart six test legs and a Claude review.\n'
            exit 1
          fi
          echo "All required sections present."

  review:
    name: Claude review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    outputs:
      verdict: ${{ steps.verdict.outputs.value }}
    steps:
      - name: Fail closed when the review credential is missing
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is available. Refusing to skip review while auto-merge is possible."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Review the PR
        uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          # ONE credential, never two. The action validates every key it is HANDED, not
          # every key it needs, so an `anthropic_api_key:` line that resolves to the empty
          # string (the secret is unset in this repo) fails the job before it makes any
          # request at all: one turn, $0 spent, and a stack trace naming neither secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # OFF because it authenticates differently from the rest of the action: the
          # classifier constructs `new Anthropic({ apiKey })` directly, which has no OAuth
          # path, so with only CLAUDE_CODE_OAUTH_TOKEN set it throws "Could not resolve
          # authentication" and fails the whole job -- having spent $0, while the perfectly
          # good OAuth token sits unused. It defaults to true, so it has to be switched off
          # explicitly by anyone authenticating the way this repo does.
          classify_inline_comments: false
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            This is the Omnia desktop clipper — a standalone PyQt6 tray app (macOS, Windows,
            Linux). House rules:
            - Cross-platform first: platform-specific code (pyobjc/AX, win32, X11) stays behind
              sys.platform guards and platform-marked deps; the app must import everywhere.
            - Pure logic separated from Qt glue so tests run headless (the existing tests/
              suite creates no QApplication — keep it that way).
            - Never block the Qt event loop on network/OCR/accessibility calls.
            - Capture/context rules: context resolution order is position -> focused element ->
              PDF page; never return a sentence that does not contain the selected word; never
              disturb the user's selection or clipboard beyond the documented synth-copy.

            Inspect the change with `gh pr diff` and `gh pr view`, read surrounding code for
            context, and judge correctness (a concrete failing scenario for every defect you
            claim), cross-platform safety, tests, and the rules above.

            Post findings as a single `gh pr comment` (clean PR: short summary; defective PR:
            each blocking issue with file:line, failure scenario, suggested fix).

            Finally — MANDATORY LAST ACTION — write your one-word verdict:
              echo APPROVE > "$RUNNER_TEMP/verdict"     # no blocking issues
              echo BLOCKING > "$RUNNER_TEMP/verdict"    # at least one blocking issue
            If you write nothing, the pipeline treats the review as BLOCKING.
          claude_args: '--model claude-opus-5 --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(echo:*)"'
      - name: Publish verdict
        id: verdict
        run: |
          v=$(cat "$RUNNER_TEMP/verdict" 2>/dev/null || echo BLOCKING)
          if [ "$v" != "APPROVE" ]; then v=BLOCKING; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Review verdict: $v"

  merge:
    name: Auto-merge
    needs: [test, pr-body, review]
    if: needs.review.outputs.verdict == 'APPROVE' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge when the automerge label is present
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          if printf '%s\n' "$labels" | grep -qx automerge; then
            gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$HEAD_SHA"
            echo "PR #$PR merged at $HEAD_SHA."
          else
            echo "No automerge label — review is APPROVE but merging is left to a human."
          fi
